version: '3.8'

volumes:
  mysql-data:
networks:
  spring-boot-mysql-network:
    name: spring-boot-mysql-network
services:
  mysqldb:
    image: mysql:lts
    command: --mysql-native-password=ON
    ports:
      - "3308:3306"
    environment:
      - MYSQL_DATABASE=reunion-services
      - MYSQL_USER=reunion-services_user
      - MYSQL_PASSWORD=x5kuJfcc04jRbEsMaJh9hYdmDg9NWXDyMe9wxm+Hz7s=
      - MYSQL_ROOT_PASSWORD=eEcUFEoBCJcf5GamDGsx604RZP3p0CBaUYHWXCuiZgs=
    networks:
      - spring-boot-mysql-network
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      retries: 5
      interval: 3s
      timeout: 30s
  reunion-services:
    build: .
    ports:
      - "8090:8080"
    depends_on:
      mysqldb:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb:3306/reunion-services?autoReconnect=true&allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=reunion-services_user
      - SPRING_DATASOURCE_PASSWORD=x5kuJfcc04jRbEsMaJh9hYdmDg9NWXDyMe9wxm+Hz7s=
    networks:
      - spring-boot-mysql-network